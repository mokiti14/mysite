<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoリスト</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 ToDoリスト</h1>
        </header>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="新しいタスクを入力..." />
            <button id="addBtn">追加</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">すべて</button>
            <button class="filter-btn" data-filter="active">未完了</button>
            <button class="filter-btn" data-filter="completed">完了済み</button>
        </div>

        <ul id="taskList" class="task-list">
            <!-- タスクがここに追加されます -->
        </ul>

        <div class="stats">
            <span id="taskCount">0個のタスク</span>
            <button id="clearCompleted">完了済みを削除</button>
        </div>
    </div>

    <script src="todo.js"></script>
</body>
</html>
